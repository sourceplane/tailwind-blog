apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The blog (Next.js, Tailwind CSS and Contentlayer MDX on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  # How the site runs itself for orun.work's live Preview tab
  # (saas-parallel-baselining PB4): `orun preview` starts this, and a coding
  # session keeps it running while it works, so the person watches it change
  # as it is built. The dev server binds the box's loopback only, on a fixed
  # port, and installs first, so a checkout the session has not installed yet
  # still comes up.
  # INIT_CWD is what the package's own dev script sets (cross-env
  # INIT_CWD=$PWD): Contentlayer finds the content from it.
  preview:
    run:
      - sh
      - -c
      - pnpm install --frozen-lockfile --prefer-offline --filter "@app/web..." && INIT_CWD="$PWD" exec node_modules/.bin/next dev -H 127.0.0.1 -p 3000
    port: 3000
    path: /
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_TELEMETRY_DISABLED: "1"
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: tailwind-blog-web-{dev,stage,prod}.
    workerName: tailwind-blog-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # The site's public origin (sitemap, RSS, OG and JSON-LD links are
    # absolute): the environment's SITE_URL when intent.yaml sets one (a custom
    # domain), else its workers.dev URL. The subdomain is written out rather
    # than read from ${WORKERS_DEV_SUBDOMAIN}: the composition exports that to
    # the smoke step only, so the build saw it empty and baked
    # `https://<worker>-<env>..workers.dev` into every absolute link.
    # ${ORUN_ENVIRONMENT} the runner sets for every step.
    buildCommand: NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://tailwind-blog-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders the blog (the header's link to /blog — not
    # the site's name, which is the owner's to change and HTML-escaped when it
    # carries an `&` or `'`), a post page renders, and the RSS feed the build
    # writes is served as XML. Each response is buffered before grep so an
    # early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'href=\"/blog/\"' && post=$(curl -sfL \"${DEPLOYED_URL}/blog/code-sample/\") && echo \"${post}\" | grep -q '<h1' && rss=$(curl -sfL \"${DEPLOYED_URL}/feed.xml\") && echo \"${rss}\" | grep -q '<rss'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
