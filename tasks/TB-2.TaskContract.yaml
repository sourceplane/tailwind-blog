apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: TB-2
  title: "The blog on Workers"
spec:
  goal: The Tailwind CSS Starter Blog runs on Cloudflare Workers + Static Assets through OpenNext, with its tests and a README that says how it maps to Vercel
  affects:
    - apps/web
    - tests/web
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - README.md
    - .gitignore
  doneWhen:
    - pnpm typecheck, lint, test and build are green
    - wrangler dev serves every route the template has, its feeds, its search index and its 404
  gates: []
